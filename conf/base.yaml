# conf/base.yaml — configuração do pipeline adaptativo ereno-Adaptativo

run_name: ereno-glow-0
seed: 42

# ── GRASP ──────────────────────────────────────────────────────────────────────
grasp:
  enabled: true
  max_iterations: 10

# ── Dataset ────────────────────────────────────────────────────────────────────
# O nome do dataset vem do argumento posicional da CLI; aqui ficam só
# particionador e argumento.
dataset:
  name: all_in_one_cicids
  partitioner: iid        # iid | dirichlet | shard | exponential | linear | attack
  partitioner_arg: null   # alpha (dirichlet) ou shards_per_client (shard)

# ── Topologia ──────────────────────────────────────────────────────────────────
# Para modo 'federated': topology é ignorado (star implícita).
# Para modo 'gossip': topology pode ser nome (ring|chain|star)
#                     ou caminho para um YAML em conf/topologies/.
topology:
  type: ring              # ring | chain | star | caminho .yaml
  num_nodes: 3            # usado quando type é ring|chain|star (CLI --clients tem precedência)

# ── Simulação ──────────────────────────────────────────────────────────────────
simulation:
  num_rounds: 20
  strategy: xgb_bagging   # ensemble | federated_nb | xgb_bagging | xgb_cyclic

# ── Architecture Manager ───────────────────────────────────────────────────────
# Define qual modo (federated ou gossip) será usado em cada round.
architecture:
  manager: fixed          # fixed | distributed
  default_mode: federated
  # --- v2: troca DISTRIBUÍDA e AUTOMÁTICA (descomente e use manager: distributed) ---
  # Sem schedule: cada nó detecta falha localmente e se auto-protege (FL->GL,
  # fail-fast); a troca global vira commit por quórum; recovery (GL->FL) é
  # cuidadoso (participação plena estável por dwell_rounds + cooldown).
  # initial_mode: federated       # base eficiente; GL é o fallback
  # quorum:                        # vazio = maioria dos nós ativos (⌊n/2⌋+1)
  # dwell_rounds: 3                # rounds cheios estáveis antes de recuperar p/ FL
  # cooldown_rounds: 2             # anti-flapping entre commits
  # faults:                        # GROUND TRUTH do ambiente (não lido pelo controle)
  #   - {round: 6,  nodes: [3]}         # nó 3 cai no round 6  -> detectado -> FL->GL
  #   - {round: 12, nodes: [3], up: true}  # nó 3 volta        -> detectado -> GL->FL
  # Agregação dos rounds gossip: inplace (média ponderada) | score | xgb.
  # Com strategy xgb_* use 'xgb' — boosters não podem ser promediados.
  aggregation: xgb
  # active_clients é opcional — omitir usa todos os nós disponíveis.
  # Explícito aqui por legibilidade (num_nodes=3 fixo); os IDs referem-se
  # às partições de dados 0..N-1.
  schedule:
    - {from: 1,  to: 10, mode: federated, active_clients: [0, 1, 2]}
    - {from: 11, to: 20, mode: gossip,    active_clients: [0, 1, 2]}

# Monitor externo (observabilidade, read-only). Opt-in: desabilitado por padrão.
# Quando enabled, o processo expõe um endpoint REST que o monitor CONSULTA (pull)
# e persiste uma trilha de auditoria JSONL (seq monotônico, contínuo entre runs).
# Eventos: architecture_change (troca FL<->GL) e node_failure (nó identificado).
monitor:
  enabled: false
  host: 127.0.0.1
  port: 8722
  serve: true                              # sobe o endpoint REST (pull)
  trail: results/monitor_events.jsonl      # trilha de auditoria persistida
