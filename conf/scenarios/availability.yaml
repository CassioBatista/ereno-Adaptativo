# Driver 1: INACTIVITY. Benign-only traffic, so every alarm is a false positive and the
# stream doubles as the false-positive baseline Disaster-FD must learn to filter.
# Exercises the fail-fast FL->GL commanded by the node-local Disaster-FD monitor and the
# GL->FL return decided by the federated Disaster-FD.
name: availability
description: >-
  Benign-only traffic. Three nodes go inactive and come back. The FL->GL switch is
  commanded by the node-local Disaster-FD monitor on local evidence (fail-fast,
  detect_lag rounds, no regional quorum); further losses while in GL trigger nothing,
  because GL absorbs them; the GL->FL return is decided by the federated Disaster-FD
  after the dwell evidence plus its decision latency, and has no fallback of any kind.
stream: benign_only
# Time reference supplied by Disaster-FD, in two cadences; the agent infers no time from
# the traffic. IEC 61850 profile: 1-s local tick, frame times carried as metadata.
cadence:
  local: {period_s: 1.0}     # node-local Disaster-FD tick: detect_lag, watchdog, event window
  federated: {every: 1}      # regional Disaster-FD tick: dwell, cmd_latency, federated decisions
traffic_time: frame
profile:                     # domain binding (docs/PROFILES.md)
  name: iec61850-goose-sv
  label_set: ereno-7
  attribution: protocol_source
nodes: 14
fusion_k: 2

# Pinned so this file, not the script, determines the stream. The generator records the
# SHA-256 of these inputs in results/manifest_<name>.json.
data:
  train: all_in_one_ereno_train
  test: all_in_one_ereno_test
  benign_cap: 500000
model:
  features_file: features/all_in_one_ereno_train_combined.json   # the canonical GRASP-24
  seed: 42
  num_boost_round: 10
  max_depth: 4
  eta: 0.1
sim_epoch: "2026-01-01T00:00:00Z"   # synthetic anchor for the relative trace time

timing:
  detect_lag: 2       # node-local Disaster-FD commands the fail-fast FL->GL
  dwell: 3            # full-membership evidence for the federated Disaster-FD
  cmd_latency: 3      # federated Disaster-FD decides the GL->FL return
  watchdog: 3         # D: agent's wait on its own local FD (used only if it is down)
local_fd_available: true

# The benign-only stream has ~724 windows; every round below must fall inside it.
schedule:
  - {round: 100, event: node_failure,  node: 13, note: "local Disaster-FD commands FL->GL"}
  - {round: 200, event: node_failure,  node: 12, note: "already in GL: no transition"}
  - {round: 300, event: node_failure,  node: 11}
  - {round: 480, event: node_recovery, node: 11}
  - {round: 540, event: node_recovery, node: 12}
  - {round: 600, event: node_recovery, node: 13, note: "membership full -> dwell starts"}
