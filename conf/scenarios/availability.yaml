# Driver 1: INACTIVITY. Benign-only traffic, so every alarm is a false positive and the
# stream doubles as the false-positive baseline the monitor must learn to filter.
# Exercises the single autonomous action in the system (fail-fast FL->GL) and the
# monitor-commanded GL->FL return.
name: availability
description: >-
  Benign-only traffic. Three nodes go inactive and come back. The FL->GL switch is
  autonomous (fail-fast, detect_lag rounds); further losses while in GL trigger nothing,
  because GL absorbs them; the GL->FL return is commanded by the monitor after the
  dwell evidence plus the command latency, and has no autonomous fallback.
stream: benign_only
window_seconds: 1.0
nodes: 14
fusion_k: 2

# Pinned so this file, not the script, determines the stream. The generator records the
# SHA-256 of these inputs in results/manifest_<name>.json.
data:
  train: all_in_one_ereno_train
  test: all_in_one_ereno_test
  benign_cap: 500000
model:
  features_file: features/all_in_one_ereno_train_combined.json   # the canonical GRASP-24
  seed: 42
  num_boost_round: 10
  max_depth: 4
  eta: 0.1
sim_epoch: "2026-01-01T00:00:00Z"   # synthetic anchor for the relative trace time

timing:
  detect_lag: 2       # autonomous fail-fast FL->GL
  dwell: 3            # full-membership evidence handed to the monitor
  cmd_latency: 3      # monitor issues the GL->FL command

# The benign-only stream has ~724 windows; every round below must fall inside it.
schedule:
  - {round: 100, event: node_failure,  node: 13, note: "triggers the autonomous FL->GL"}
  - {round: 200, event: node_failure,  node: 12, note: "already in GL: no autonomous action"}
  - {round: 300, event: node_failure,  node: 11}
  - {round: 480, event: node_recovery, node: 11}
  - {round: 540, event: node_recovery, node: 12}
  - {round: 600, event: node_recovery, node: 13, note: "membership full -> dwell starts"}
