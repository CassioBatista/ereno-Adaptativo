# SMOKE-TEST do pipeline distribuido no CICIDS (combinado-31, 2 rounds).
# Valida: load ARFF 410MB, particionador attack (10 classes), xgb_bagging + OR.
# Uso: python ereno.py distributed GR-G-VND 6 all_in_one_cicids_v2 \
#        --conf conf/experiments/cicids_smoke_combined.yaml --clients 10

run_name: cicids-smoke-combined
seed: 42

grasp:
  features_file: features/all_in_one_cicids_combined.json

dataset:
  name: all_in_one_cicids_v2
  partitioner: attack
  partitioner_arg: null

topology:
  type: ring
  num_nodes: 10

simulation:
  num_rounds: 2
  strategy: xgb_bagging
  xgb_fusion: or
  eval_sample: 50000

architecture:
  manager: fixed
  default_mode: federated
  aggregation: xgb_union
  schedule:
    - {from: 1, to: 2, mode: federated}
