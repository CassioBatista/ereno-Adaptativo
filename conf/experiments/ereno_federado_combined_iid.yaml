# ERENO — FEDERADO, partição IID (generalistas, NÃO especialistas), combinado-24.
# Cada cliente recebe uma fatia IID de TODOS os ataques + normal. O baseline
# CENTRALIZADO monolítico é impresso ao final. Comparar com o federado-especialista.
# Uso: ~/venv-ereno314/bin/python ereno.py distributed GR-G-VND 6 all_in_one_ereno_train \
#        --conf conf/experiments/ereno_federado_combined_iid.yaml --clients 10

run_name: ereno-fed-combined-iid-c10
seed: 42

grasp:
  features_file: features/all_in_one_ereno_train_combined.json

dataset:
  name: all_in_one_ereno_train
  test_file: all_in_one_ereno_test
  partitioner: iid
  benign_cap: 500000
  partitioner_arg: null

topology:
  type: ring
  num_nodes: 10

simulation:
  num_rounds: 20
  strategy: xgb_bagging
  xgb_fusion: or
  eval_sample: 500000

architecture:
  manager: fixed
  default_mode: federated
  aggregation: xgb_union
  schedule:
    - {from: 1, to: 20, mode: federated}
