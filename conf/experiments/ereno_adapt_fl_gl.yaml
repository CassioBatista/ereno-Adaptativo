# ERENO — ADAPTABILIDADE: 20 rounds FEDERADO → 20 rounds GOSSIP.
# Exercita a comutação de arquitetura em tempo de execução (a tese).
# Na comutação (round 21) o modelo federado é semeado em todos os nós.
# Uso: python ereno.py distributed GR-G-VND 6 all_in_one_ereno_train \
#        --conf conf/experiments/ereno_adapt_fl_gl.yaml --clients 10

run_name: ereno-adapt-fl-gl-c10
seed: 42

grasp:
  features_file: features/all_in_one_ereno_train_xgb.json

dataset:
  name: all_in_one_ereno_train
  test_file: all_in_one_ereno_test
  partitioner: attack
  benign_cap: 500000
  partitioner_arg: null

topology:
  type: ring
  num_nodes: 10

simulation:
  num_rounds: 40
  strategy: xgb_bagging
  xgb_fusion: or
  eval_sample: 500000

architecture:
  manager: fixed
  default_mode: federated
  aggregation: xgb_union
  schedule:
    - {from: 1,  to: 20, mode: federated}
    - {from: 21, to: 40, mode: gossip}
