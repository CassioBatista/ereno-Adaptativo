# CICIDS2017 (TI/smart grid) — ADAPTABILIDADE: 20 FEDERADO → 20 GOSSIP.
# Réplica do experimento de comutação do ERENO. 10 clientes 1:1.
# Uso: python ereno.py distributed GR-G-VND 6 all_in_one_cicids_v2 #        --conf conf/experiments/cicids_adapt_fl_gl.yaml --clients 10

run_name: cicids-adapt-fl_gl-c10
seed: 42

grasp:
  features_file: features/all_in_one_cicids_v2_xgb.json

dataset:
  name: all_in_one_cicids_v2
  partitioner: attack
  partitioner_arg: null

topology:
  type: ring
  num_nodes: 10

simulation:
  num_rounds: 40
  strategy: xgb_bagging
  xgb_fusion: or
  eval_sample: 300000

architecture:
  manager: fixed
  default_mode: federated
  aggregation: xgb_union
  schedule:
    - {from: 1,  to: 20, mode: federated}
    - {from: 21, to: 40, mode: gossip}
