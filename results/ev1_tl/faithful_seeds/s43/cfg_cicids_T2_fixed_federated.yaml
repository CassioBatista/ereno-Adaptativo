# Faithful replay of the Disaster-FD traces (paper 2, 5.3): the network of the scenario for every
# policy (links: scenario -- a ring link is up only when both ends answer each other), rounds at
# 60 r + 30 s (never on the instant of a scenario event), registered arrivals at 30 and 60 min.
# Placeholders filled by run_tl_faithful.sh.
run_name: ev1-tl-faithful-s43-cicids_T2_fixed_federated
seed: 43
grasp:
  features_file: features/all_in_one_ev1_cicids_train_combined.json
dataset:
  name: all_in_one_ev1_cicids_train
  test_file: all_in_one_ev1_cicids_test
  partitioner: specialists
  
  partitioner_arg: null
topology:
  type: ring
  num_nodes: 14
simulation:
  num_rounds: 97
  strategy: xgb_bagging
  xgb_fusion: or
  xgb_fusion_k: 1
