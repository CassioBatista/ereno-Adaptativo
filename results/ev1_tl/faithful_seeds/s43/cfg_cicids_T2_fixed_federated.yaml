  arrival_s: {2: 1800, 3: 1800, 10: 1800, 11: 1800, 8: 3600, 9: 3600}
architecture:
  manager: trust_level
  trace: /home/cassi/datasets/disaster_fd_scenario2
  t_end: 5880
  delta_s: 60
  round_offset_s: 30
  links: scenario
  policy: fixed_federated
  gl_peers: both    # 2026-11-24: fixed GL with the same nodes as ReSIDS (protocol change log)
  node_holdings: retain
  holdings_log: /home/cassi/ereno-Adaptativo/results/ev1_tl/faithful_seeds/s43/cicids_T2_fixed_federated
  aggregation: xgb_union
