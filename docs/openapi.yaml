openapi: 3.1.0
info:
  title: ReSIDS Monitor API (REST)
  version: "1.9.0"
  description: >
    Observability and trust-level API between a ReSIDS agent and its Disaster-FD monitor
    process (fd/monitor.py simulates the latter). The architecture has two roles only:
    Disaster-FD (one monitor process colocated with each node, federated by region) and the
    agent; there is no external monitor or supervisor. The same events can also be pushed
    over CoAP (see docs/API.md, "CoAP push"); this spec covers the REST/HTTP surface only.


    API 1.9.0 (docs/TRUST_LEVEL.md): Disaster-FD detects failures and PUSHES a trust level
    (TL) per observation to POST /trust_level; the agent decides its learning mode from it
    (TL < 30 local, 30 <= TL < 50 gossip, TL >= 50 federated; settle time 5 s; no TL for
    15 s -> local) and records each switch as an architecture_change with
    decided_by: agent. Disaster-FD supplies evidence, never a mode. The monitor still POLLS
    /events to observe what the agent decided.


    IMPLEMENTATION STATUS: /events, /status and /health are implemented (with the gaps
    noted in docs/API.md 2.1). POST /trust_level and /status.trust are SPECIFIED AND NOT
    IMPLEMENTED in fd/monitor.py; the policy is implemented offline in
    scripts/tl_policy_replay.py and validated on the Disaster-FD pilot run.


    The /commands endpoints (1.4.0-1.7.0, never implemented) are DEPRECATED: set_mode is
    replaced by the trust-level policy, and isolate_node / readmit_node return with the
    intrusion API and the Byzantine model (future work). They are kept below, marked
    deprecated, as the starting point of that work (docs/COMMANDS.md).


    The surfaces differ in exposure: /events is read-only and unauthenticated on loopback;
    /trust_level changes the mode of a protection system, so it is HOST-LOCAL only (loopback
    or a Unix socket, never routed), as the monitor is colocated with the agent.


    The Event payload is NOT redefined here: it is $ref'd from
    ../schemas/event.schema.json, which is the single authoritative definition. OpenAPI
    3.1 is used precisely because it is fully JSON Schema 2020-12 compatible, so the two
    cannot drift apart (they already did once, over `detector_nodes`).


    Behavioural contract: events are returned ordered by `seq` ascending; `since` is
    EXCLUSIVE (`seq > since`); the monitor must poll with the highest CONTIGUOUS seq it
    has received, never the highest seen (docs/API.md §2).
servers:
  - url: http://{host}:{port}
    variables:
      host: { default: "127.0.0.1" }
      port: { default: "8722" }
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
              example: { status: ok }
  /status:
    get:
      summary: Current state, API version and retention window
      description: >
        Read at monitor start-up, or after a long outage, to resync state without
        replaying the event history. It is NOT the periodic probe: a periodic
        `GET /events?since=<contiguous>` already proves liveness and reconciles in one
        round trip.
      responses:
        "200":
          description: Current mode, round, membership, API version and retention bounds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /events:
    get:
      summary: Adaptation events (incremental, ordered by seq)
      description: >
        Returns events with `seq > since`, in ascending `seq` order. Retention is
        bounded: only events with `seq >= retained_from_seq` (see /status) are still
        available; asking for older ones is an error rather than a silent truncation.
      parameters:
        - name: since
          in: query
          description: Exclusive lower bound. Pass the highest CONTIGUOUS seq received.
          schema: { type: integer, default: 0, minimum: 0 }
        - name: limit
          in: query
          description: >
            Maximum events to return. When the result is truncated by `limit`, more are
            available: poll again with `since` set to the last `seq` returned.
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - name: type
          in: query
          description: Filter by event type.
          schema:
            type: string
            description: >
              node_isolated and intrusion_detected are accepted for pre-1.9.0 trails; a
              1.9.0 agent does not emit them.
            enum: [architecture_change, node_failure, node_recovery, node_isolated, intrusion_detected]
      responses:
        "200":
          description: Events with seq greater than `since`, ascending. Empty array means nothing new.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "400":
          description: Malformed parameter (non-integer `since`/`limit`, unknown `type`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: >
            `since` predates the retention window: the events in between are gone from
            this surface. The consumer must resync from /status (and, if a complete trail
            is required, from the JSONL audit file).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /trust_level:
    post:
      summary: Disaster-FD trust-level observation (1.9.0; NOT IMPLEMENTED in fd/monitor.py)
      description: >
        One observation per probe of the colocated monitor (schemas/trust_level.schema.json,
        a one-to-one map of a row of the Disaster-FD monitor CSV). The agent keeps the
        latest TL, maps it to a band and commits a new band once it has held for the
        settle time S; if no observation arrives for F seconds it falls back to local
        (reason tl_stale). The response carries no decision: what the agent did, and when,
        is the architecture_change event on /events. Host-local only (see info).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrustLevel" }
      responses:
        "204":
          description: Observation accepted.
        "400":
          description: Malformed — fails schemas/trust_level.schema.json.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            `wrong_monitor`: the observation names a monitor or client other than the one
            this agent is paired with. A client switches only on its own monitor's TL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /commands:
    post:
      deprecated: true
      summary: Issue a command (DEPRECATED in 1.9.0; never implemented — see docs/COMMANDS.md)
      description: >
        The actuation surface. Execution is AT MOST ONCE, keyed by the client-generated
        `command_id`: re-submitting the same id returns the stored outcome with
        `replayed: true` and executes nothing. Reissuing after a lost response is
        therefore the correct recovery, not a risk.


        A command accepted during round r commits at the START OF r+1: a mode change
        applied mid-aggregation would split the round between two protocols. So `202`
        means accepted, NOT yet in effect.


        The response is not the commit record. The authoritative record is the EVENT the
        command produces, carrying `decided_by` and `command_id` (docs/COMMANDS.md §3.1).
      security:
        - mutualTLS: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Command" }
      responses:
        "202":
          description: "Accepted; commits at the next round boundary. `outcome: applied`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "200":
          description: >
            Nothing to do. Either the requested state was already in effect
            (`outcome: no_op` — e.g. a set_mode that lost the race to the deadline D),
            or this `command_id` was already processed (`replayed: true`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "400":
          description: Malformed — fails schemas/command.schema.json.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "401":
          description: No valid channel identity. Checked before the body is parsed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "403":
          description: >
            `bad_signature`, `stale_epoch` (authority_epoch below the highest accepted —
            the split-brain guard), or `expired` (past `not_after`, or past the 60 s cap).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "409":
          description: >
            `expectation_failed`: the `expect` block does not match reality, so the
            decision was taken on a stale view. Nothing was applied; `state` carries the
            current state to reconcile against.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "412":
          description: >
            The agent's own safety condition is unmet: `evidence_not_met` (a GL->FL return
            while membership is incomplete) or `membership_floor` (an isolation that would
            drop below min_nodes). Overridable with `force: true`, which is recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "422":
          description: "`unknown_node`: no such node index."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "429":
          description: >
            `too_soon`: flap protection. A commanded switch within `min_switch_interval`
            of the last one is refused, so a commander cannot starve booster diffusion by
            oscillating the mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "503":
          description: "`not_ready`: agent starting or shutting down."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
    get:
      deprecated: true
      summary: Command log, incremental (DEPRECATED in 1.9.0; never implemented)
      description: >
        Mirrors GET /events exactly: `since` is EXCLUSIVE, results ascend by `cmd_seq`,
        which is gap-free, and the consumer polls with its highest CONTIGUOUS value.


        Every ANSWERED command appears here, accepted or rejected. Rejected commands
        produce no event, so without this log a refused actuation attempt — a stale view,
        a bad epoch, a failed override — would leave no trace anywhere.
      security:
        - mutualTLS: []
      parameters:
        - name: since
          in: query
          description: Exclusive lower bound on `cmd_seq`. Pass the highest contiguous one received.
          schema: { type: integer, default: 0, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: Command results with cmd_seq greater than `since`, ascending.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommandResult" }
        "400":
          description: Malformed parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /commands/{command_id}:
    get:
      deprecated: true
      summary: Stored outcome of one command (DEPRECATED in 1.9.0; never implemented)
      description: >
        Lets a monitor that lost a response find out what happened without reissuing.
        Reissuing is also safe (at-most-once), so this is a convenience, not the only
        recovery path.
      security:
        - mutualTLS: []
      parameters:
        - name: command_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The stored result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "404":
          description: Unknown command_id (never received, or beyond retention).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: >
        TLS 1.3 with client certificates, mandatory on the command surface. It proves the
        CONNECTION, not the DECISION — hence the additional per-command Ed25519 signature
        in schemas/command.schema.json: with a TLS-terminating proxy or an IoT hub in the
        path, that intermediary would otherwise become an implicit commander and the audit
        trail could not tell (docs/COMMANDS.md §6.2).
  schemas:
    Event:
      $ref: "../schemas/event.schema.json"
    TrustLevel:
      $ref: "../schemas/trust_level.schema.json"
    Command:
      $ref: "../schemas/command.schema.json"
    CommandResult:
      $ref: "../schemas/command_result.schema.json"
    Status:
      type: object
      required: [current_mode, round, last_seq, api_version]
      properties:
        api_version:
          type: string
          description: API version this endpoint implements, for in-band discovery.
          examples: ["1.9.0"]
        current_mode: { type: [string, "null"], enum: [local, federated, gossip, null] }
        trust:
          type: [object, "null"]
          description: >
            1.9.0: the evidence the mode follows, so a consumer sees a pending band before
            it commits (docs/TRUST_LEVEL.md 5).
          properties:
            fd_monitor: { type: string, examples: ["monitor07"] }
            trust_level: { type: [number, "null"], minimum: 0 }
            tl_ts: { type: [string, "null"], format: date-time }
            band: { type: [string, "null"], enum: [local, gossip, federated, null] }
            candidate:
              type: [string, "null"]
              enum: [local, gossip, federated, null]
              description: Band that differs from the current mode and is waiting out the settle time.
            candidate_since: { type: [string, "null"], format: date-time }
            stale: { type: boolean, description: "No observation for longer than the freshness limit F." }
            tl_bands:
              type: object
              properties:
                gl: { type: number, examples: [30] }
                fl: { type: number, examples: [50] }
            settle_s: { type: number, examples: [5] }
            stale_after_s: { type: number, examples: [15] }
        round: { type: integer, minimum: 0 }
        active_nodes:
          type: [array, "null"]
          items: { type: integer, minimum: 0 }
          description: Node indices participating; null means all are active.
        failed_nodes:
          type: array
          items: { type: integer, minimum: 0 }
        isolated_nodes:
          deprecated: true    # 1.9.0: command surface superseded (docs/TRUST_LEVEL.md 7)
          type: array
          items: { type: integer, minimum: 0 }
          description: >
            Removed by command, not by failure. Distinct from failed_nodes because the
            remedy differs: a failed node returns on its own, an isolated one needs
            readmit_node. An isolated node also keeps emitting traffic — isolation is an
            IDS-level membership change, not containment (docs/COMMANDS.md §4.4).
        profile:
          type: [object, "null"]
          description: >
            The domain binding in force (docs/PROFILES.md): which label set `attack` draws
            from, where `source_node` comes from (always null when attribution is `none`),
            and whether events carry traffic timestamps.
          properties:
            name: { type: string, examples: ["iec61850-goose-sv", "iot-flow", "it-flow"] }
            label_set: { type: string, examples: ["ereno-7", "ciciot2023-7"] }
            attribution: { type: string, enum: [protocol_source, device_address, none] }
            traffic_time: { type: string, enum: [frame, none] }
        switch_pending:
          deprecated: true    # 1.9.0: command surface superseded (docs/TRUST_LEVEL.md 7)
          type: [object, "null"]
          description: >
            Non-null while inactivity has been observed and the agent awaits the set_mode
            command from its node-local Disaster-FD monitor. Normally short (detect_lag);
            it lasts until deadline_round only if that local process is unresponsive.
          properties:
            from_mode: { type: string, enum: [federated, gossip] }
            to_mode: { type: string, enum: [federated, gossip] }
            since_round: { type: integer, minimum: 0 }
            deadline_round:
              type: integer
              minimum: 0
              description: >
                Round at which the agent's watchdog D falls back to FL->GL on its own if its
                node-local Disaster-FD monitor has not commanded it (reason
                autonomous_fallback).
        authority_epoch:
          deprecated: true    # 1.9.0: command surface superseded (docs/TRUST_LEVEL.md 7)
          type: integer
          minimum: 0
          description: >
            Highest epoch accepted. A commander must carry at least this value; lower is
            refused with stale_epoch. Bumped on monitor failover.
        evidence:
          deprecated: true    # 1.9.0: command surface superseded (docs/TRUST_LEVEL.md 7)
          type: [object, "null"]
          description: >
            What the agent will check a command against. Without this a monitor cannot know
            whether a GL->FL return would be accepted and would be reduced to guess-and-retry.
          properties:
            membership_full_for_rounds: { type: integer, minimum: 0 }
            dwell_required: { type: integer, minimum: 0 }
        last_cmd_seq:
          deprecated: true    # 1.9.0: command surface superseded (docs/TRUST_LEVEL.md 7)
          type: integer
          minimum: 0
          description: Highest cmd_seq answered. Compare with your contiguous value, as with last_seq.
        last_seq:
          type: integer
          minimum: 0
          description: Highest seq emitted so far. Compare with your contiguous seq to detect gaps.
        retained_from_seq:
          type: integer
          minimum: 1
          description: >
            Oldest seq still served by /events. A `since` below this yields 410 instead of
            a silently short answer.
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: [string, "null"] }
